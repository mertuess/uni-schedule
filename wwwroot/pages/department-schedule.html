<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Расписание кафедры - МАУ</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
<header>
    <div class="container">
        <a href="https://mauniver.ru">
            <img alt="МАУ" src="../resources/images/logo-bottom.svg">
        </a>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Главная</a>
                </li>
                <li>
                    <a href="teachers-schedule.html">Преподаватели</a>
                </li>
                <li>
                    <a class="active" href="department-schedule.html" id="dep-btn">Кафедры</a>
                </li>
                <li>
                    <a href="rooms-workload.html">Аудитории</a>
                </li>
                <li>
                    <a href="dashboard.html" id="d-btn">Панель оператора</a>
                </li>
                <li>
                    <a href="login.html" id="auth-link">Вход</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div class="main-content">
            <h1>Свободные окна преподавателей одной кафедры</h1>

            <div class="info-block">
                <p>Выберите преподавателей из списка</p>
            </div>

            <div class="search-form">
                <div class="form-group">
                    <label>Кафедра</label>
                    <select id="department">
                        <option value="-1">Выберите кафедру</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Дата начала</label>
                    <input id="start-date" type="date">
                </div>
                <div class="form-group">
                    <label>Дата окончания</label>
                    <input id="end-date" type="date">
                </div>
                <button class="btn" id="search-slots" onclick="teachersSchedulesSearch()">Найти</button>
                <button class="btn" id="export-ical" onclick="exportToIcal()" disabled style="display:none; margin-left:10px; background:#28a745;"> Скачать .ics</button>
            </div>

            <div id="results">
            </div>
            <div class="message-box" id="message"></div>
        </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/check_login.js"></script>
<script src="../js/teachers.js"></script>
<script src="../js/departments.js"></script>
<script src="../js/ical-export.js"></script>
</body>

</html>
