<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Вход - МАУ</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="shortcut icon" href="../resources/images/favicon.ico" type="image/x-icon">
</head>

<body>
	<header>
		<div class="container">
			<a href="https://mauniver.ru">
				<img src="../resources/images/logo-bottom.svg" alt="МАУ">
			</a>
			<nav>
				<ul>
					<li>
						<a href="../index.html">Главная</a>
					</li>
					<li>
						<a href="pages/teachers-schedule.html" id="t-btn">Преподаватели</a>
					</li>
					<li>
						<a href="pages/rooms-workload.html" id="r-btn">Аудитории</a>
					</li>
					<li>
						<a href="pages/dashboard.html" id="d-btn">Панель оператора</a>
					</li>
					<li>
						<a href="login.html" class="active">Вход</a>
					</li>
				</ul>
			</nav>
		</div>
	</header>

	<main>
		<div class="container">
			<div class="login-container">
				<h2>Вход в систему</h2>
				<div id="login-form">
					<div class="form-group">
						<label>Email</label>
						<input type="email" id="email" required="">
					</div>
					<div class="form-group">
						<label>Пароль</label>
						<input type="password" id="password" required="">
					</div>
					<button onclick="login()" class="login-btn">Войти</button>
					<div id="error-message" class="error"></div>
				</div>
			</div>
		</div>
	</main>

	<script src="../js/cookie.js"></script>
	<script src="../js/api.js"></script>
	<script src="../js/login.js"></script>
</body>

</html>
