<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Расписание аудиторий - UniSchedule</title>
				<link rel="stylesheet" href="../css/style.css">
					<link rel="shortcut icon" href="../resources/images/favicon.ico" type="image/x-icon">
</head>
	<body>
		<header>
			<a href="https://mauniver.ru">
				<img src="../resources/images/logo-bottom.svg" alt="на университет">
        </a>
			<nav>
				<div class="container">
					<ul id="navMenu">
						<li>
							<a href="../index.html">Главная</a>
						</li>
						<li>
							<a href="schedule_teachers.html">Расписание по преподавателям</a>
						</li>
						<li>
							<a href="schedule_room.html">Расписание по аудиториям</a>
						</li>
					</ul>
				</div>
			</nav>
		</header>

		<main>
			<div class="container">
				<div class="main-content">
					<h1>Расписание аудиторий</h1>

					<div class="search-form">
						<div class="form-group">
							<label for="roomId">ID аудитории:</label>
							<input type="number" id="roomId" placeholder="Введите ID аудитории">
                    </div>

						<div class="form-group">
							<label for="startDate">Дата начала:</label>
							<input type="date" id="startDate">
                    </div>

						<div class="form-group">
							<label for="endDate">Дата окончания:</label>
							<input type="date" id="endDate">
                    </div>

						<button id="searchBtn" class="btn">Найти</button>
					</div>

					<div id="resultContainer"></div>
					<div id="messageBox"></div>
				</div>
			</div>
		</main>

		<script src="../js/api.js"></script>
		<script src="../js/auth.js"></script>
		<script src="../js/schedule_room.js"></script>
	</body>
</html>
