<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Панель администратора - МАУ</title>
				<link rel="stylesheet" href="../css/style.css">
					<link rel="shortcut icon" href="../resources/images/favicon.ico" type="image/x-icon">
</head>

	<body>
		<header>
			<div class="container">
				<a href="https://mauniver.ru">
					<img src="../resources/images/logo-bottom.svg" alt="МАУ">
            </a>
				<nav>
					<ul>
						<li>
							<a href="../index.html">Главная</a>
						</li>
						<li>
							<a href="teachers-schedule.html">Преподаватели</a>
						</li>
						<li>
							<a href="rooms-workload.html">Аудитории</a>
						</li>
						<li>
							<a href="dashboard.html" class="active">Панель оператора</a>
						</li>
						<li>
							<a href="login.html" id="auth-link">Выход</a>
						</li>
					</ul>
				</nav>
			</div>
		</header>

		<main>
			<div class="container">
				<div class="main-content">
					<h2>Управление пользователями</h2>

					<div class="info-block">
						<p>
							Всего пользователей: <strong id="user-count">0</strong>
						</p>
						<a href="user_create.html" class="btn">Создать пользователя</a>
					</div>

					<div class="table-container">
						<table>
							<thead>
								<tr>
									<th>ID</th>
									<th>Email</th>
									<th>Имя</th>
									<th>Роль</th>
									<th>Действия</th>
								</tr>
							</thead>
							<tbody id="users-list"></tbody>
						</table>
					</div>

					<h2 style="margin-top: 40px;">Управление кафедрами</h2>

					<div class="info-block">
						<button id="createDeptBtn" class="btn">Создать кафедру</button>
					</div>

					<div class="table-container">
						<table>
							<thead>
								<tr>
									<th>ID</th>
									<th>Название</th>
									<th>Действия</th>
								</tr>
							</thead>
							<tbody id="departments-list"></tbody>
						</table>
					</div>

					<div id="dept-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
						<div style="background: white; padding: 30px; border-radius: 18px; max-width: 400px; width: 90%;">
							<h2 id="dept-modal-title">Создать кафедру</h2>
							<div class="form-group">
								<label>Название кафедры</label>
								<input type="text" id="dept-name" style="width: 100%;">
        </div>
							<div style="display: flex; gap: 10px; margin-top: 20px;">
								<button id="saveDeptBtn" class="btn">Сохранить</button>
								<button id="closeDeptModal" class="btn" style="background: gray;">Отмена</button>
							</div>
						</div>
					</div>

		<script src="../js/cookie.js"></script>
		<script src="../js/api.js"></script>
		<script src="../js/dashboard.js"></script>
	</body>

</html>
