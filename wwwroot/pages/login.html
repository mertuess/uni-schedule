<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Вход - МАУ</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
<header>
    <div class="container">
        <a href="https://mauniver.ru">
            <img alt="МАУ" src="../resources/images/logo-bottom.svg">
        </a>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Главная</a>
                </li>
                <li>
                    <a href="pages/teachers-schedule.html" id="t-btn">Преподаватели</a>
                </li>
                <li>
                    <a href="department-schedule.html" id="dep-btn">Кафедры</a>
                </li>
                <li>
                    <a href="pages/rooms-workload.html" id="r-btn">Аудитории</a>
                </li>
                <li>
                    <a href="pages/dashboard.html" id="d-btn">Панель оператора</a>
                </li>
                <li>
                    <a class="active" href="login.html">Вход</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div class="login-container">
            <h2>Вход в систему</h2>
            <div id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input id="email" required="" type="email">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input id="password" required="" type="password">
                </div>
                <button class="login-btn" onclick="login()">Войти</button>
                <div class="error" id="error-message"></div>
            </div>
            <h2>Токен внешнего api</h2>
            <div class="form-group">
                <label>Токен</label>
                <input id="o-api-token" required="" type="text">
            </div>
            <button class="login-btn" onclick="saveToken()">Сохранить токен</button>
        </div>
    </div>
</main>

<script src="../js/cookie.js"></script>
<script src="../js/api.js"></script>
<script src="../js/check_login.js"></script>
<script src="../js/login.js"></script>
</body>

</html>
