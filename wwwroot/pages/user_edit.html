<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Редактировать пользователя - UniSchedule</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
<header>
    <a href="https://mauniver.ru">
        <img alt="МАУ" src="../resources/images/logo-bottom.svg">
    </a>
    <nav>
        <ul>
            <li>
                <a href="../index.html">Главная</a>
            </li>
            <li>
                <a href="teachers-schedule.html">Преподаватели</a>
            </li>
            <li>
                <a href="department-schedule.html" id="dep-btn">Кафедры</a>
            </li>
            <li>
                <a href="rooms-workload.html">Аудитории</a>
            </li>
            <li>
                <a class="active" href="dashboard.html">Панель оператора</a>
            </li>
        </ul>
    </nav>
</header>

<main>
    <div class="container">
        <div class="form-container">
            <h1>Редактировать пользователя</h1>

            <div id="editUserForm">
                <div class="form-group">
                    <label for="mail">Почта</label>
                    <input id="mail" type="email">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input id="password" type="password">
                </div>

                <div class="form-group">
                    <label for="name">Имя (рус)</label>
                    <input id="name" type="text">
                </div>

                <div class="form-group">
                    <label for="engName">Имя (англ)</label>
                    <input id="engName" type="text">
                </div>

                <div class="form-group">
                    <label for="role">Роль</label>
                    <select id="role">
                        <option value="operator">Оператор</option>
                        <option value="teacher">Преподаватель</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="department">Кафедра (ID)</label>
                    <select id="department">
                        <option value="null">Без кафедры</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button class="btn btn-success" onclick="submit()">Сохранить</button>
                    <a class="btn btn-secondary" href="dashboard.html">Отмена</a>
                </div>

                <div class="message-box" id="messageBox"></div>
            </div>
        </div>
    </div>
</main>

<script src="../js/cookie.js"></script>
<script src="../js/api.js"></script>
<script src="../js/check_login.js"></script>
<script src="../js/user_edit.js"></script>
</body>

</html>
