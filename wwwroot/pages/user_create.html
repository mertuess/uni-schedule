<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Создать пользователя - UniSchedule</title>
				<link rel="stylesheet" href="../css/style.css">
					<link rel="shortcut icon" href="../resources/images/favicon.ico" type="image/x-icon">
</head>

	<body>
		<header>
			<a href="https://mauniver.ru">
				<img src="../resources/images/logo-bottom.svg" alt="МАУ">
        </a>
			<nav>
				<ul>
					<li>
						<a href="../index.html">Главная</a>
					</li>
					<li>
						<a href="teachers-schedule.html">Преподаватели</a>
					</li>
					<li>
						<a href="rooms-workload.html">Аудитории</a>
					</li>
					<li>
						<a href="dashboard.html" class="active">Панель оператора</a>
					</li>
				</ul>
			</nav>
		</header>

		<main>
			<div class="container">
				<div class="main-content">
					<h1>Создать пользователя</h1>

					<div id="createUserForm">
						<div class="form-group">
							<label for="email">Email *</label>
							<input type="email" id="email">
                    </div>

						<div class="form-group">
							<label for="password">Пароль *</label>
							<input type="password" id="password">
                    </div>

						<div class="form-group">
							<label for="name">Имя (рус) *</label>
							<input type="text" id="name">
                    </div>

						<div class="form-group">
							<label for="engName">Имя (англ) *</label>
							<input type="text" id="engName">
                    </div>

						<div class="form-group">
							<label for="role">Роль *</label>
							<select id="role">
								<option value="">Выберите роль</option>
								<option value="teacher">Преподаватель</option>
								<option value="operator">Оператор</option>
							</select>
						</div>

						<div class="form-group">
							<label for="department">Кафедра</label>
							<select id="department">
								<option value="null">Без кафедры</option>
							</select>
						</div>

						<div class="form-actions">
							<button onclick="submit()" class="btn btn-success">Создать</button>
							<a href="dashboard.html" class="btn btn-secondary">Отмена</a>
						</div>

						<div id="messageBox" class="message-box"></div>
					</div>
				</div>
			</div>
		</main>

		<script src="../js/cookie.js"></script>
		<script src="../js/api.js"></script>
		<script src="../js/user_create.js"></script>
	</body>

</html>
