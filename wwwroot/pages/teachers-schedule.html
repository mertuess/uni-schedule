<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Расписание преподавателей - МАУ</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="shortcut icon" href="../resources/images/favicon.ico" type="image/x-icon">
</head>

<body>
	<header>
		<div class="container">
			<a href="https://mauniver.ru">
				<img src="../resources/images/logo-bottom.svg" alt="МАУ">
			</a>
			<nav>
				<ul>
					<li>
						<a href="../index.html">Главная</a>
					</li>
					<li>
						<a href="teachers-schedule.html" class="active">Преподаватели</a>
					</li>
					<li>
						<a href="rooms-workload.html">Аудитории</a>
					</li>
					<li>
						<a href="dashboard.html" id="d-btn">Панель оператора</a>
					</li>
					<li>
						<a href="login.html" id="auth-link">Вход</a>
					</li>
				</ul>
			</nav>
		</div>
	</header>

	<main>
		<div class="container">
			<div class="main-content">
				<h1>Свободные окна преподавателей</h1>

				<div class="info-block">
					<p>Выберите преподавателей из списка</p>
				</div>

				<div class="search-form">
					<div class="form-group">
						<label>Поиск преподавателей</label>
						<input type="text" id="teacher-ids" placeholder="Начните вводить ФИО преподавателя" autocomplete="off">
						<div id="teacher-autocomplete-list" class="autocomplete-list"></div>
						<div id="selected-teachers-list" class="selected-teachers"></div>
					</div>
					<div class="form-group">
						<label>Дата начала</label>
						<input type="date" id="start-date">
					</div>
					<div class="form-group">
						<label>Дата окончания</label>
						<input type="date" id="end-date">
					</div>
					<button class="btn" id="search-slots" onclick="teachersSchedulesSearch()">Найти</button>
				</div>

				<div id="results">
				</div>
				<div id="message" class="message-box"></div>
			</div>
		</div>
	</main>

	<script src="../js/cookie.js"></script>
	<script src="../js/api.js"></script>
	<script src="../js/teachers.js"></script>
</body>

</html>
