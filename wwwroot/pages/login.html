<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Вход - МАУ</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
<header>
    <div class="container">
        <a href="https://mauniver.ru">
            <img alt="МАУ" src="../resources/images/logo-bottom.svg">
        </a>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Главная</a>
                </li>
                <li>
                    <a href="pages/teachers-schedule.html" id="t-btn">Преподаватели</a>
                </li>
                <li>
                    <a href="department-schedule.html" id="dep-btn">Кафедры</a>
                </li>
                <li>
                    <a href="pages/rooms-workload.html" id="r-btn">Аудитории</a>
                </li>
                <li>
                    <a href="pages/dashboard.html" id="d-btn">Панель оператора</a>
                </li>
                <li>
                    <a class="active" href="login.html">Вход</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div class="login-container">
            <h2>Вход в систему</h2>
            <div id="login-form">
                <form onsubmit="event.preventDefault(); login();">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input autocomplete="username" class="form-control" id="email" name="email"
                               placeholder="operator@mauniver.ru" required=""
                               type="email">
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label for="password">Пароль</label>
                        <input autocomplete="current-password" class="form-control" id="password" name="password"
                               placeholder="Введите пароль" required=""
                               type="password">
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" type="submit">
                        Войти
                    </button>
                </form>
                <div class="alert alert-danger" id="error-message" style="display:none; margin-top: 15px;"></div>
            </div>
        </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/check_login.js"></script>
<script src="../js/login.js"></script>
</body>

</html>
