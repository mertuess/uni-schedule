<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Вход - МАУ</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
<header>
    <div class="container">
        <a href="https://mauniver.ru">
            <img alt="МАУ" src="../resources/images/logo-bottom.svg">
        </a>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Главная</a>
                </li>
                <li>
                    <a href="pages/teachers-schedule.html" id="t-btn">Преподаватели</a>
                </li>
                <li>
                    <a href="department-schedule.html" id="dep-btn">Кафедры</a>
                </li>
                <li>
                    <a href="pages/rooms-workload.html" id="r-btn">Аудитории</a>
                </li>
                <li>
                    <a href="pages/dashboard.html" id="d-btn">Панель оператора</a>
                </li>
                <li>
                    <a class="active" href="login.html">Вход</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div class="login-container">
            <h2>Вход в систему</h2>
            <div id="login-form">
				<form onsubmit="event.preventDefault(); login();">
					<div class="form-group">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" class="form-control"
							   placeholder="operator@mauniver.ru" required=""
							   autocomplete="username">
						</div>
					<div class="form-group" style="margin-top: 15px;">
						<label for="password">Пароль</label>
						<input type="password" id="password" name="password" class="form-control"
							   placeholder="Введите пароль" required=""
							   autocomplete="current-password">
						</div>
					<button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
						Войти
					</button>
				</form>
				<div id="error-message" class="alert alert-danger" style="display:none; margin-top: 15px;"></div>
            </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/check_login.js"></script>
<script src="../js/login.js"></script>
</body>

</html>
