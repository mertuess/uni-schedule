<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание пользователя – МАУ</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../resources/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <a href="https://mauniver.ru" class="logo">
            <img src="../resources/images/logo-bottom.svg" alt="на университет">
        </a>
    </header>

    <main>
        <div class="container">
            <div class="main-content">
                            <a href="dashboard.html" class="back-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Назад к списку
                </a>

                <h1>Создание нового пользователя</h1>

                <form id="create-user-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="email" placeholder="example@mauniver.ru" required>
                        </div>
                        <div class="form-group">
                            <label>Роль *</label>
                            <select id="role" required class="custom-select">
                                <option value="">Выберите роль</option>
                                <option value="user">Пользователь</option>
                                <option value="teacher">Преподаватель</option>
                                <option value="admin">Администратор</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Пароль *</label>
                            <input type="password" id="password" placeholder="Введите пароль" required>
                            <div class="password-requirements">Минимум 6 символов</div>
                        </div>
                        <div class="form-group">
                            <label>Подтверждение пароля *</label>
                            <input type="password" id="confirm-password" placeholder="Повторите пароль" required>
                        </div>
                    </div>

                    <button type="button" class="login-btn" id="save-btn">Создать пользователя</button>
                </form>

                <div id="success-message" class="message success"></div>
                <div id="error-message" class="message error"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div>
                <img src="../resources/images/logo-header.svg" alt="МАУ" class="logo">
                <div class="social">
                    <a href="#"><img src="../resources/images/vk.svg" alt="VK"></a>
                    <a href="#"><img src="../resources/images/telegram.svg" alt="Telegram"></a>
                    <a href="#"><img src="../resources/images/ok.svg" alt="OK"></a>
                </div>
            </div>
            <div>
                <p>ФГАОУ ВО «Мурманский арктический университет»</p>
                <p>ул. Егорова, 16, Мурманск</p>
                <p>Тел.: 8 (8152) 21-39-27</p>
                <p>Email: rector@mstu.edu.ru</p>
            </div>
            <div class="feedback-links">
                <a href="#">Сообщить о проблеме</a>
                <a href="#">Замечания по сайту</a>
                <p class="copy">© 2026 Мурманский арктический университет</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
