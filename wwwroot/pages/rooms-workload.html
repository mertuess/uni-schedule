    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="../css/style.css" rel="stylesheet">
    <link href="../resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>

<body>
<header>
    <div class="container">
        <a href="https://mauniver.ru">
            <img alt="МАУ" src="../resources/images/logo-bottom.svg">
        </a>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Главная</a>
                </li>
                <li>
                    <a href="teachers-schedule.html">Преподаватели</a>
                </li>
                <li>
                    <a href="department-schedule.html" id="dep-btn">Кафедры</a>
                </li>
                <li>
                    <a class="active" href="rooms-workload.html">Аудитории</a>
                </li>
                <li>
                    <a href="dashboard.html" id="d-btn">Панель оператора</a>
                </li>
                <li>
                    <a href="login.html" id="auth-link">Вход</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div class="main-content">
            <h1>Статистика загруженности аудиторий</h1>
            <div class="form-group">
                <select id="buildings">
                    <option value="">Загрузка...</option>
                </select>
            </div>
            <div class="form-group">
                <select id="rooms">
                    <option value="">Сначала выбать корпус</option>
                </select>
            </div>
            <div class="form-group">
                <label>Дата начала</label>
                <input id="start-date" type="date">
            </div>
            <div class="form-group">
                <label>Дата окончания</label>
                <input id="end-date" type="date">
            </div>
            <button class="btn" id="search-room-workload" onclick="showRoomWorkload()">Показать по аудитории
            </button>
            <button class="btn" id="search-build-workload" onclick="showBuildingWorkload()">Показать по корпусу
            </button>
            <button class="btn hide" id="search-builds-workload" onclick="showBuildingsWorkload()">Показать по
                корпусам
            </button>
            <button class="btn" disabled id="export-ical" onclick="exportRoomToIcal()"
                    style="display:none; margin-left:10px; background:#28a745;"> Скачать .ics
            </button>
        </div>

        <div id="results"></div>
    </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/check_login.js"></script>
<script src="../js/room.js"></script>
<script src="../js/ical-export.js"></script>

<script>
    function formatDate(firstday) {
        var curr = new Date;
        if (firstday){
            var date = new Date(curr.setDate(curr.getDate() - curr.getDay()+1));
        }
        else{
            var date = new Date(curr.setDate(curr.getDate() - curr.getDay()+7));
        }

//  let date = new Date();
        let day = String(date.getDate()).padStart(2, '0');
        let month = String(date.getMonth() + 1).padStart(2, '0');
        let year = date.getFullYear();

        return `${year}-${month}-${day}`;
    }

    document.querySelector('#start-date').value = formatDate(true);
    document.querySelector('#end-date').value = formatDate(false);
</script>

</body>

</html>
